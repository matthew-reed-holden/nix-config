# Local overrides for pacman's postgresql, pulled in by an include_dir line
# that `just install-postgres-config` appends to the data dir's postgresql.conf.

# pg_cron (AUR) must be preloaded, and only works in one database.
# Firecrawl's job queue is the only user, so it lives there.
shared_preload_libraries = 'pg_cron'
cron.database_name = 'firecrawl'

# '*' rather than the docker0 address: postgres starts before dockerd, so
# 172.17.0.1 doesn't exist yet at boot. pg_hba.conf (and firewalld) decide
# who actually gets in.
listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
